<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>簡單計算機</title>
</head>
<body>

<h1>簡單計算機</h1>

<input type="text" id="num1" placeholder="數字1">
<input type="text" id="num2" placeholder="數字2">

<br><br>

<button onclick="calc('add')">加</button>
<button onclick="calc('minus')">減</button>
<button onclick="calc('multiply')">乘</button>
<button onclick="calc('divide')">除</button>

<br><br>

<h3 id="result">結果：</h3>

<script>
async function calc(op) {
    let n1 = document.getElementById("num1").value;
    let n2 = document.getElementById("num2").value;

    const response = await fetch("/api/" + op, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            num1: n1,
            num2: n2
        })
    });

    const data = await response.json();
    document.getElementById("result").innerText = "結果：" + data.result;
}
</script>

</body>
</html>
